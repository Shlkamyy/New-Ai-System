name: CI

on:
  push:
    branches:
      - feature/whatsapp-alert-sorting
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # The repository currently has a Vite/esbuild peer-version conflict.
        # This flag lets CI proceed to the checks without changing project dependencies.
        run: npm install --no-package-lock --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
