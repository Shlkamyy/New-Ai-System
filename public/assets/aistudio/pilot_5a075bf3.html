<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12303C">
<meta name="application-name" content="Dr Mai Kassem">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/clinicflow-192.png">
<link rel="apple-touch-icon" href="/icons/clinicflow-192.png">
<meta name="robots" content="noindex,nofollow">
<title>Dr Mai Kassem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pilot.css">
<link rel="stylesheet" href="/native-mobile.css">
</head>
<body>
<header class="top">
 <div class="brand"><span class="logo brandDentalLogo" aria-hidden="true"><svg viewBox="0 0 48 48" width="40" height="40" xmlns="http://www.w3.org/2000/svg"><path d="M12 9C17 4 21 8 24 9c3-1 7-5 12 0 6 7 2 15 0 22-1 5-3 9-6 9-4 0-2-12-6-12s-2 12-6 12c-3 0-5-4-6-9C10 24 6 16 12 9Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 17c3 2 5 2 8 1m3 0c2 0 4-1 5-2" fill="none" stroke="currentColor" stroke-opacity=".48" stroke-width="1.4" stroke-linecap="round"/><path d="m37 1 1.6 4.5L43 7l-4.4 1.5L37 13l-1.6-4.5L31 7l4.4-1.5Z" fill="#1ab3bd"/></svg></span><div><strong class="brandSignature" lang="en" dir="ltr">Dr Mai Kassem</strong></div></div>
 <div id="who" class="who">مساحة عمل العيادة</div>
</header>
<main class="container">
 <div id="status" class="status" role="status" aria-live="polite"></div>
 <section id="loginPanel" class="panel login">
  <div class="loginWelcome" aria-label="Dr Mai Kassem">
   <span class="loginWelcomeSeal" aria-hidden="true"><svg viewBox="0 0 48 48" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6c-5 0-9 4-9 10 0 5 3 8 4 14 1 7 4 12 8 12 2 0 3-4 4-9 1-4 2-5 3-5s2 1 3 5c1 5 2 9 4 9 4 0 7-5 8-12 1-6 4-9 4-14 0-6-4-10-9-10-5 0-7 3-10 3s-5-3-10-3Z"/><path d="m18 20 4 5 9-10" stroke="#087e83"/></svg></span>
   <div><span class="loginWelcomeEyebrow">WELCOME TO</span><strong>Dr Mai Kassem</strong></div>
  </div>
  <h1 class="srOnly">تسجيل الدخول</h1>
  <div class="loginModes" role="group" aria-label="طريقة الدخول"><button type="button" data-login-mode="username" aria-pressed="true">اسم المستخدم</button><button type="button" data-login-mode="email" aria-pressed="false">البريد الإلكتروني</button></div><form id="loginForm">
   <label>اسم المستخدم أو البريد الإلكتروني<input name="login" autocomplete="username" required minlength="3"></label>
   <label>كلمة المرور<div class="passwordGroup"><input id="passwordInput" name="password" type="password" autocomplete="current-password" required><button type="button" id="togglePassword" aria-label="إظهار كلمة المرور">👁</button></div></label>
   <label class="check"><input id="rememberLogin" type="checkbox"> تذكرني على هذا الجهاز</label>
   <button type="submit" class="primary">دخول</button>
  </form>
  <button type="button" class="installAppButton" data-install-app hidden><img src="/icons/clinicflow-192.png" width="36" height="36" alt="">تثبيت التطبيق</button>
 </section>
 <section id="workspace" hidden>
  <nav id="tabs" class="tabs" aria-label="أقسام التطبيق">
   <button data-view="home" class="active">الرئيسية</button>
   <button data-view="patients">المرضى</button>
   <button data-view="crm">متابعة المرضى</button>
   <button data-view="whatsappTemplates" hidden>قوالب الرسائل</button>
   <button data-view="patientAlerts" hidden>تنبيهات المرضى</button>
   <button data-view="appointments">المواعيد</button>
   <button data-view="tasks">المهام</button>
   <button data-view="attendance">بصمة الحضور</button>
   <button data-view="attendanceReport" hidden>تقارير الحضور</button>
   <button data-view="staffShifts" hidden>شيفتات الموظفين</button>
   <button data-view="invoices">الفواتير</button>
   <button data-view="payments">المدفوعات</button>
   <button data-view="expenses">المصروفات</button>
   <button data-view="report">التقارير</button>
   <button data-view="staff" id="staffTab" hidden>الموظفين والصلاحيات</button>
   <button data-view="settings" id="settingsTab" hidden>الإعدادات</button>
   <button data-view="procedures" hidden>الإجراءات والأسعار</button>
   <button type="button" class="installAppButton" data-install-app hidden><img src="/icons/clinicflow-192.png" width="36" height="36" alt="">تثبيت التطبيق</button>
   <button id="logout">تسجيل الخروج</button>
  </nav>
  <section class="panel"><div class="sectionHead"><span id="screenModuleIcon" class="screenModuleIcon" aria-hidden="true"></span><div class="screenTitleBlock"><h1 id="sectionTitle" tabindex="-1">الرئيسية</h1><p id="screenSubtitle" class="screenSubtitle">ملخص يومك ومواعيدك ومهامك في لمحة.</p></div></div>
   <div id="workspaceContent"></div>
  </section>
 </section>
</main>
<script type="module" src="/pilot.js"></script>
</body>
</html>
